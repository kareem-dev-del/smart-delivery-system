services:
  - type: web
    name: smartdrop-admin-dashboard
    runtime: static
    rootDir: frontend/admin-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
